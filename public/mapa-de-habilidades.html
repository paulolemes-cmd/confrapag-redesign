    "email": "paulo.lemes@confrapag.com.br"
  },
  "brand": {
    "name": "Confrapag",
    "tagline": "Planeje, conquiste e cresça"
  }
};
const $=id=>document.getElementById(id);
document.title=DATA.meta.page_title+" · "+DATA.profile.name;
$("brand").innerHTML=DATA.brand?("<b>"+DATA.brand.name+"</b> · "+DATA.brand.tagline):"";
$("avatar").textContent=DATA.profile.initials||DATA.profile.name.split(" ").map(w=>w[0]).slice(0,2).join("");
$("eyebrow").textContent=DATA.meta.map_title;
$("name").textContent=DATA.profile.name;
$("roles").innerHTML="<b>"+DATA.profile.primary_role+"</b> · "+DATA.profile.secondary_role;
$("xpn").textContent=DATA.experience.value;
$("xpl").textContent=DATA.experience.label+" · "+DATA.experience.unit;
if(DATA.contact){const c=DATA.contact;const parts=[];
  if(c.site)parts.push(`<a href="${c.site_url||('https://'+c.site)}" target="_blank" rel="noopener">🌐 ${c.site}</a>`);
  if(c.linkedin)parts.push(`<a href="${c.linkedin_url||('https://'+c.linkedin)}" target="_blank" rel="noopener">in ${c.linkedin}</a>`);
  if(c.email)parts.push(`<a href="mailto:${c.email}">✉ ${c.email}</a>`);
  $("contact").innerHTML=parts.join("");}
$("summary").textContent=DATA.profile.summary;
$("ptitle").textContent=DATA.purpose.title;
$("psub").textContent=DATA.purpose.subtitle;
$("lb_ess").textContent=DATA.labels.essence;
$("lb_traj").textContent=DATA.labels.trajectory||"Trajetória";
$("lb_core").textContent=DATA.labels.core_attributes;
$("lb_special").textContent=DATA.labels.special_skills;
$("lb_equip").textContent=DATA.labels.equipment;
$("essence").innerHTML=[DATA.essence.line_1,DATA.essence.line_2,DATA.essence.line_3].map(t=>"<div>"+t+"</div>").join("");
$("traj").innerHTML=(DATA.trajectory||[]).map(e=>`<div class="item" style="--dot:${e.color}">
  <div class="per">${e.period}</div><div class="ti">${e.title}</div>
  <div class="wh">${e.what}</div><div class="sk"><b>Formou:</b> ${e.skill}</div></div>`).join("");
const order=["s1","s2","s3","s4","s5","s6","s7","s8","s9"];
const ms=[...DATA.map_skills].sort((a,b)=>order.indexOf(a.position_class)-order.indexOf(b.position_class));
$("map").innerHTML=ms.map(s=>`<div class="cell" style="border-color:${s.color}55;box-shadow:0 0 22px ${s.color}22 inset">
  <div class="ic">${s.icon}</div><div class="t" style="color:${s.color}">${s.title}</div>
  <div class="d">${s.description}</div><div class="tip">${s.tooltip}</div></div>`).join("");
$("core").innerHTML=DATA.core_attributes.map(a=>`<div class="chip" style="border-color:${a.color}55">
  <div class="ic">${a.icon}</div><div><div class="t" style="color:${a.color}">${a.title}</div>
  <div class="d">${a.short_description}</div></div></div>`).join("");
$("special").innerHTML=DATA.special_skills.map(s=>`<div class="card" style="border-top-color:${s.color}">
  <div class="t">${s.icon} ${s.title}</div><div class="d">${s.description}</div></div>`).join("");
$("equip").innerHTML=DATA.equipment.map(s=>`<div class="card" style="border-top-color:${s.color}">
  <div class="t">${s.icon} ${s.title}</div><div class="d">${s.description}</div></div>`).join("");
$("qtext").textContent="“"+DATA.quote.text+"”";
$("qauthor").textContent="— "+DATA.quote.author;
$("evid").textContent="Perfil construído a partir de evidências de trajetória e atuação. "+(DATA.evidence_summary.uncertain_or_omitted[0]||"");
</script>
</body>
